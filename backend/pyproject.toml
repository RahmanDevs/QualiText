[project]
name = "qualitext-backend"
version = "0.1.0"
description = "QualiText Backend API and Quality Workers for NLP & LLM datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic[email]>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.2.0,<6.0.0",
    "boto3>=1.35.0,<2.0.0",
    "polars>=1.14.0,<2.0.0",
    "pyarrow>=18.0.0,<20.0.0",
    "structlog>=24.4.0,<26.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "pwdlib[argon2]>=0.2.1,<1.0.0",
    "python-multipart>=0.0.17,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

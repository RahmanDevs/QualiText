name: QualiText CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Verify uv.lock
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type Check
        run: uv run mypy --strict app/core app/modules
      - name: Validate OpenAPI Schema
        run: |
          uv run python -c "import json; from app.main import app; schema = app.openapi(); assert '/api/v1/auth/sso/providers' in schema['paths']; assert '/readyz' in schema['paths']; assert '/metrics' in schema['paths']; print('OpenAPI paths:', len(schema['paths']))"
      - name: Run Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, Typecheck & Production Build
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Run Tests
        run: npm test -- --run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Backend Dependency Vulnerability Scan (pip-audit)
        working-directory: backend
        run: uvx pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend Dependency Audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Trivy Config & Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  e2e-a11y:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install Backend Dependencies & Seed E2E Database
        working-directory: backend
        run: |
          uv sync --all-extras --frozen
          rm -rf /tmp/qualitext_e2e.db /tmp/qualitext_e2e_storage
          DATABASE_URL=sqlite+aiosqlite:////tmp/qualitext_e2e.db PYTHONPATH=. .venv/bin/python -m alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:////tmp/qualitext_e2e.db LOCAL_STORAGE_PATH=/tmp/qualitext_e2e_storage PYTHONPATH=. .venv/bin/python -m scripts.seed
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright & Axe Accessibility Scanner
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.a11y.spec.mjs

name: QualiText CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type Check
        run: uv run mypy --strict app/core app/modules
      - name: Run Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Run Tests
        run: npm test -- --run

replicaCount: 1

api:
  image: qualitext/api:1.0.0
  pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    APP_ENV: production
    ALLOW_EXTERNAL_LLM: "false"
    STORAGE_BACKEND: s3
    EMBEDDING_BACKEND: auto
    VECTOR_INDEX_BACKEND: auto
    CELERY_TASK_ALWAYS_EAGER: "false"
    OTEL_SERVICE_NAME: qualitext-api

worker:
  image: qualitext/worker:1.0.0
  pullPolicy: IfNotPresent
  concurrency: 4
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

frontend:
  image: qualitext/frontend:1.0.0
  pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: false
  className: nginx
  host: qualitext.internal
  tls:
    enabled: false
    secretName: qualitext-tls

monitoring:
  prometheusScrape: true
  serviceMonitor:
    enabled: false
    interval: 30s

secrets:
  secretKey: ""
  databaseUrl: "postgresql+asyncpg://qualitext:change-me@postgres:5432/qualitext"
  redisUrl: "redis://redis:6379/0"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  oidcClientSecret: ""
  samlSharedSecret: ""

sso:
  oidcEnabled: "false"
  oidcProviderName: "Corporate SSO"
  oidcIssuerUrl: ""
  oidcClientId: ""
  samlEnabled: "false"
  samlIdpSsoUrl: ""
  samlEntityId: "qualitext-sp"

postgresql:
  enabled: true

redis:
  enabled: true

minio:
  enabled: true

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qualitext.fullname" . }}-config
  labels:
    {{- include "qualitext.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.api.env.APP_ENV | quote }}
  ALLOW_EXTERNAL_LLM: {{ .Values.api.env.ALLOW_EXTERNAL_LLM | quote }}
  STORAGE_BACKEND: {{ .Values.api.env.STORAGE_BACKEND | quote }}
  EMBEDDING_BACKEND: {{ .Values.api.env.EMBEDDING_BACKEND | quote }}
  VECTOR_INDEX_BACKEND: {{ .Values.api.env.VECTOR_INDEX_BACKEND | quote }}
  CELERY_TASK_ALWAYS_EAGER: {{ .Values.api.env.CELERY_TASK_ALWAYS_EAGER | quote }}
  OTEL_SERVICE_NAME: {{ .Values.api.env.OTEL_SERVICE_NAME | quote }}
  OIDC_ENABLED: {{ .Values.sso.oidcEnabled | quote }}
  OIDC_PROVIDER_NAME: {{ .Values.sso.oidcProviderName | quote }}
  OIDC_ISSUER_URL: {{ .Values.sso.oidcIssuerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.sso.oidcClientId | quote }}
  SAML_ENABLED: {{ .Values.sso.samlEnabled | quote }}
  SAML_IDP_SSO_URL: {{ .Values.sso.samlIdpSsoUrl | quote }}
  SAML_ENTITY_ID: {{ .Values.sso.samlEntityId | quote }}

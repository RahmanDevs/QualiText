apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qualitext.fullname" . }}-secret
  labels:
    {{- include "qualitext.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey must be set (>= 32 chars) in production" .Values.secrets.secretKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.secrets.redisUrl | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  SAML_SHARED_SECRET: {{ .Values.secrets.samlSharedSecret | quote }}

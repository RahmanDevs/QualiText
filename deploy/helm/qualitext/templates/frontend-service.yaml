apiVersion: v1
kind: Service
metadata:
  name: {{ include "qualitext.fullname" . }}-frontend
  labels:
    {{- include "qualitext.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
